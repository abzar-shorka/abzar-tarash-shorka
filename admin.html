<!DOCTYPE html>

<html lang="fa">

<head>
<meta charset="UTF-8">
<title>پنل ادمین</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;800&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

<div class="admin-container">

<script>
if(localStorage.getItem("admin")!=="true"){
window.location.href="admin-login.html";
}
</script>

<header>
<h1>پنل مدیریت</h1>
<h2>نسخه جدید ادمین</h2>
<a href="index.html" onclick="logout()" style="color:gold;">
خروج
</a>

</header>

<div class="box">

<input id="name" placeholder="نام محصول">

<input id="price" placeholder="قیمت">

<input id="desc" placeholder="توضیحات">

<input id="category" placeholder="دسته بندی">

<button onclick="addProduct()">
افزودن
</button>

</div>

<div id="list" class="products"></div>
<input type="file" id="img">
<script>
alert("ADMIN NEW VERSION");
const mySupabase = window.supabase.createClient(
"https://soseymbxahhztupqloim.supabase.co",
"sb_publishable_SkgJ1ubh3QCWqfOCtzkoDw_9nVIOeeO"
);
let editingId = null;
let products = [];

async function addProduct(){

let name = document.getElementById("name").value;
let price = document.getElementById("price").value;
let desc = document.getElementById("desc").value;
let category = document.getElementById("category").value;

let file = document.getElementById("img").files[0];

let imageUrl = "";

if(file){

const fileName =
Date.now() + "-" + file.name;

const { error: uploadError } =
await mySupabase.storage
.from("products")
.upload(fileName, file);

if(uploadError){

alert(uploadError.message);
return;

}

const { data } =
mySupabase.storage
.from("products")
.getPublicUrl(fileName);

imageUrl = data.publicUrl;

}

let error;

if(editingId){

const result =
await mySupabase
.from("products")
.update({
name,
price,
desc,
category,
img:imageUrl || undefined
})
.eq("id", editingId);

error = result.error;

editingId = null;

}else{

const result =
await mySupabase
.from("products")
.insert([
{
name,
price,
desc,
category,
img:imageUrl
}
]);

error = result.error;

}
console.log("UPLOAD URL:", imageUrl);
console.log("INSERT ERROR:", error);
console.log("INSERT DONE");
if(error){

alert(error.message);
return;

}

alert("محصول اضافه شد ✅");

loadProducts();

}


async function loadProducts(){

const { data, error } = await mySupabase
.from("products")
.select("*");

if(error){

console.log(error);
return;

}

products = data;

show();

}

function show(){

let box = document.getElementById("list");

box.innerHTML = "";

products.forEach((p)=>{

box.innerHTML += `

<div class="card">

<img src="${p.img || ''}" alt="${p.name}">

<h3>${p.name}</h3>

<p>${p.desc}</p>

<span>${p.price} تومان</span>

<br><br>

<button onclick="editProduct(${p.id})">
✏️ ویرایش
</button>

<button onclick="deleteProduct(${p.id})">
🗑️ حذف
</button>

</div>

`;

});

}

function logout(){

localStorage.removeItem("admin");

}

loadProducts();
  function editProduct(id){

let product =
products.find(p => p.id === id);

editingId = id;

document.getElementById("name").value =
product.name;

document.getElementById("price").value =
product.price;

document.getElementById("desc").value =
product.desc;

document.getElementById("category").value =
product.category;

window.scrollTo({
top:0,
behavior:"smooth"
});

}
async function deleteProduct(id){

if(!confirm("حذف شود؟")){
return;
}

const { error } =
await mySupabase
.from("products")
.delete()
.eq("id", id);

if(error){

alert(error.message);
return;

}

alert("محصول حذف شد ✅");

loadProducts();

}
</script>

</div>

</body>
</html>
